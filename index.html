<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis XV Valentina</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Mis XV Valentina</h1>
            <p>¡Gracias por acompañarme en este día tan especial! Comparte tus mejores fotos aquí.</p>
        </header>

        <form id="uploadForm">
            <div class="file-upload-wrapper">
                <!-- Se abre la cámara o la galería directamente -->
                <input type="file" id="fileInput" accept="image/*" capture="environment" required>
                <label for="fileInput" class="custom-file-label">
                    <span id="fileName">Toca para elegir una foto 📷</span>
                </label>
            </div>
            <button type="submit" id="submitBtn">Subir a la galería ✨</button>
        </form>

        <!-- Pantalla de carga -->
        <div id="loader" class="hidden">
            <div class="spinner"></div>
            <p>Guardando tu recuerdo...</p>
        </div>

        <!-- Mensaje de éxito -->
        <div id="successMessage" class="hidden">
            <h2>¡Foto enviada! 💖</h2>
            <p>Gracias por compartir este momento.</p>
            <button onclick="location.reload()">Subir otra foto</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
