<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparte tus fotos y videos con Valentina</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    
    <main class="container">
        <header class="header">
            <span class="subtitle">Mis XV Años</span>
            <h1>Valentina</h1>
            <p>¡Gracias por acompañarnos en esta noche tan mágica! Comparte aquí las mejores fotos y videos que captures.</p>
        </header>

        <div class="upload-card">
            <form id="uploadForm">
                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-content">
                        <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <p class="drop-text">Arrastra fotos/videos aquí o <span>haz clic para buscar</span></p>
                        <p class="file-info">Videos de máximo 1 minuto (mayores pueden tardar en subirse)</p>
                    </div>
                    <input type="file" id="fileInput" name="media" accept="image/*,video/*" multiple hidden>
                </div>

                <div class="input-group">
                    <input type="text" id="guestName" placeholder="Tu nombre o apodo (opcional)" autocomplete="off">
                </div>

                <!-- NUEVO: Contenedor de la barra de progreso -->
                <div id="progressContainer" class="progress-container hidden">
                    <div class="progress-bar-bg">
                        <div id="progressBar" class="progress-bar-fill"></div>
                    </div>
                    <p id="progressText" class="progress-text">Subiendo 0 de 0...</p>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary" disabled>
                    <span>Subir recuerdos</span>
                </button>
            </form>

            <div id="statusMessage" class="status-message hidden"></div>
        </div>

        <div id="previewContainer" class="preview-grid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
