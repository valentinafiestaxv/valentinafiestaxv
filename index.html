<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV de Valentina1q 👑 - Comparte tus fotos</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    
    <main class="container">
        <header class="header">
            <span class="subtitle">Mis XV Años</span>
            <h1>Valentina</h1>
            <p>¡Gracias por acompañarnos en esta noche tan mágica! Comparte aquí las mejores fotos y momentos que captures.</p>
        </header>

        <div class="upload-card">
            <form id="uploadForm">
                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-content">
                        <svg class="upload-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        <p class="drop-text">Arrastra tus fotos aquí o <span>haz clic para buscar</span></p>
                        <p class="file-info">Sube tantas fotos como quieras</p>
                    </div>
                    <input type="file" id="fileInput" name="photos" accept="image/*" multiple hidden>
                </div>

                <div class="input-group">
                    <input type="text" id="guestName" placeholder="Tu nombre o apodo (opcional)" autocomplete="off">
                </div>

                <button type="submit" id="submitBtn" class="btn-primary" disabled>
                    <span>Subir recuerdos</span>
                </button>
            </form>

            <div id="statusMessage" class="status-message hidden"></div>
        </div>

        <div id="previewContainer" class="preview-grid"></div>
    </main>

    <footer>
        <p>Hecho con 111✨ para la noche de Valentina</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
